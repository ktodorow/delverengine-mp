name: v1.08 prototype baseline

on:
  push:
    branches:
      - mp-v108-prototype
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Temurin JDK 8 x64
        uses: actions/setup-java@v5
        with:
          architecture: x64
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Build and smoke test
        shell: pwsh
        run: .\gradlew.bat clean smokeTest --no-daemon
