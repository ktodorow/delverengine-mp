apply plugin: "java"

sourceCompatibility = 1.8
sourceSets.main.java.srcDirs = [ "src/" ]
sourceSets.test.java.srcDirs = [ "test/" ]

dependencies {
    testImplementation "junit:junit:4.13.2"
}

project.ext.mainClassName = "com.interrupt.dungeoneer.DesktopStarter"
project.ext.assetsDir = project.file("../Dungeoneer/assets")

task run(dependsOn: classes, type: JavaExec) {
    main = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
}

task runTestLevel(dependsOn: classes, type: JavaExec) {
    group = "application"
    description = "Launches the repository-owned open-source test level."
    main = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    args "--test-level"
}

task runDirectHost(dependsOn: classes, type: JavaExec) {
    group = "application"
    description = "Hosts a two-to-four-slot approved Direct Connect lobby on the open-source test floor."
    main = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    args "--direct-host"
    if(project.hasProperty("sessionPort")) args "--session-port=" + project.property("sessionPort")
    if(project.hasProperty("campaignCapacity")) args "--campaign-capacity=" + project.property("campaignCapacity")
    if(project.hasProperty("campaignId")) args "--campaign-id=" + project.property("campaignId")
    if(project.hasProperty("nickname")) args "--nickname=" + project.property("nickname")
    if(project.hasProperty("avatar")) args "--avatar=" + project.property("avatar")
    if(project.hasProperty("profileRoot")) args "--profile-root=" + project.property("profileRoot")
}

task runDirectClient(dependsOn: classes, type: JavaExec) {
    group = "application"
    description = "Connects to a Direct Connect Host on the open-source test floor."
    main = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    args "--direct-connect=" + (project.hasProperty("sessionAddress")
            ? project.property("sessionAddress") : "127.0.0.1")
    if(project.hasProperty("sessionPort")) args "--session-port=" + project.property("sessionPort")
    if(project.hasProperty("nickname")) args "--nickname=" + project.property("nickname")
    if(project.hasProperty("avatar")) args "--avatar=" + project.property("avatar")
    if(project.hasProperty("campaignSlot")) args "--campaign-slot=" + project.property("campaignSlot")
    if(project.hasProperty("profileRoot")) args "--profile-root=" + project.property("profileRoot")
}

task discoverPrivateSessions(dependsOn: classes, type: JavaExec) {
    group = "application"
    description = "Lists compatible Direct Connect Private Sessions discovered on the LAN."
    main = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.assetsDir
    args "--discover-private-sessions"
    if(project.hasProperty("sessionPort")) args "--session-port=" + project.property("sessionPort")
}

task diagnoseDirectConnect(dependsOn: classes, type: JavaExec) {
    group = "verification"
    description = "Reports TCP and UDP reachability separately for one Direct Connect Host."
    main = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.assetsDir
    args "--diagnose-direct-connect=" + (project.hasProperty("sessionAddress")
            ? project.property("sessionAddress") : "127.0.0.1")
    if(project.hasProperty("sessionPort")) args "--session-port=" + project.property("sessionPort")
}

task directConnectNetworkHelp(dependsOn: classes, type: JavaExec) {
    group = "help"
    description = "Prints manual Windows firewall, forwarding, and CGNAT guidance."
    main = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.assetsDir
    args "--network-help"
    if(project.hasProperty("sessionPort")) args "--session-port=" + project.property("sessionPort")
}

task runOwnedTutorial(dependsOn: classes, type: JavaExec) {
    group = "application"
    description = "Validates an external Delver v1.08 archive and launches its tutorial read-only."
    main = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    args "--owned-tutorial"
    if(project.hasProperty("ownedCopy")) args "--owned-copy=" + project.property("ownedCopy")
}

task inspectOwnedCopy(dependsOn: classes, type: JavaExec) {
    group = "verification"
    description = "Prints safe metadata for an external delver.jar without mounting or copying it."
    main = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.projectDir
    args "--inspect-owned-copy"
    if(project.hasProperty("ownedCopy")) args project.property("ownedCopy")
}

task debug(dependsOn: classes, type: JavaExec) {
    main = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    debug = true
}

task dist(type: Jar) {
    manifest {
        attributes 'Main-Class': project.mainClassName
    }
    archiveName('game.jar')

    dependsOn 'processResources'
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    from(project.assetsDir) {
        exclude "save/**"
    }
    with jar
}

dist.dependsOn classes

def restrictedFileNames = [
        "delver.jar",
        "delver.exe",
        "steam_api.dll",
        "steam_api64.dll",
        "steam_appid.txt"
] as Set

task verifyOpenSourceAssets {
    group = "verification"
    description = "Rejects asset changes and known commercial game files before creating build artifacts."

    doLast {
        def trackedOutput = new ByteArrayOutputStream()
        exec {
            workingDir rootProject.projectDir
            commandLine "git", "ls-tree", "-r", "--name-only", "HEAD", "--", "Dungeoneer/assets"
            standardOutput = trackedOutput
        }

        def trackedAssets = trackedOutput.toString("UTF-8")
                .readLines()
                .findAll { !it.isEmpty() }
                .collect { rootProject.file(it).canonicalFile }
                .toSet()

        def currentAssets = fileTree(project.assetsDir)
                .matching {
                    exclude "packaged_files.txt"
                    exclude "save/**"
                }
                .files
                .collect { it.canonicalFile }
                .toSet()
        def unexpectedAssets = (currentAssets - trackedAssets).sort()
        def missingAssets = (trackedAssets - currentAssets).sort()

        if(!unexpectedAssets.isEmpty() || !missingAssets.isEmpty()) {
            throw new GradleException("Assets must exactly match tracked source files. Added: "
                    + unexpectedAssets + "; missing: " + missingAssets)
        }

        def changedOutput = new ByteArrayOutputStream()
        exec {
            workingDir rootProject.projectDir
            commandLine "git", "diff", "--name-only", "HEAD", "--", "Dungeoneer/assets"
            standardOutput = changedOutput
        }

        def changedAssets = changedOutput.toString("UTF-8").readLines().findAll { !it.isEmpty() }
        if(!changedAssets.isEmpty()) {
            throw new GradleException("Tracked assets differ from HEAD: " + changedAssets)
        }

        def restrictedAssets = currentAssets.findAll {
            restrictedFileNames.contains(it.name.toLowerCase())
        }
        if(!restrictedAssets.isEmpty()) {
            throw new GradleException("Restricted commercial files found in assets: " + restrictedAssets)
        }
    }
}

dist.dependsOn verifyOpenSourceAssets

task verifyReleaseArtifacts(type: JavaExec, dependsOn: [classes, dist, verifyOpenSourceAssets]) {
    group = "verification"
    description = "Audits release contents against tracked assets and rejects commercial or private cache data."
    main = "com.interrupt.dungeoneer.owned.ReleaseArtifactAudit"
    classpath = sourceSets.main.runtimeClasspath
    doFirst {
        def trustedClassOrigins = files(sourceSets.main.output.classesDirs, configurations.runtimeClasspath)
                .files
                .collect { it.absolutePath }
                .sort()
        setArgs([dist.archivePath.absolutePath, project.assetsDir.absolutePath] + trustedClassOrigins)
    }
}

task verifyOpenSourceDist(dependsOn: verifyReleaseArtifacts) {
    group = "verification"
    description = "Compatibility alias for the complete release artifact audit."
}

// Windows keeps loaded JARs open. Each JavaExec receives a unique core copy so a
// second Gradle invocation can rebuild the canonical JAR while a game keeps running.
tasks.withType(JavaExec).all { JavaExec javaExec ->
    def coreJarTask = project(":Dungeoneer").tasks.getByName("jar")
    File coreJar = coreJarTask.archivePath

    javaExec.doFirst {
        File isolatedDirectory = new File(buildDir, "isolated-runtime/"
                + javaExec.name + "-" + UUID.randomUUID().toString())
        javaExec.ext.isolatedCoreRuntimeDirectory = isolatedDirectory
        if(!isolatedDirectory.mkdirs() && !isolatedDirectory.isDirectory()) {
            throw new GradleException(
                    "Could not create isolated Java runtime directory: "
                            + isolatedDirectory)
        }
        copy {
            from coreJar
            into isolatedDirectory
        }
        File isolatedCoreJar = new File(isolatedDirectory, coreJar.name)
        javaExec.classpath = javaExec.classpath - files(coreJar) + files(isolatedCoreJar)
    }

    Task cleanupRuntime = tasks.create(
            javaExec.name + "IsolatedRuntimeCleanup") {
        doLast {
            if(javaExec.ext.has("isolatedCoreRuntimeDirectory")) {
                delete javaExec.ext.isolatedCoreRuntimeDirectory
            }
        }
    }
    javaExec.finalizedBy cleanupRuntime
}
